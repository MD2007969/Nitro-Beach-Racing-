<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nitro Beach Racing</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061b2b;color:white;font-family:system-ui}canvas{width:100%;height:100%;touch-action:none}#hud{position:absolute;top:12px;left:12px;font-weight:800;text-shadow:0 2px 5px #000;font-size:18px;pointer-events:none}#menu{position:absolute;inset:0;background:#061a2ddd;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}button{border:0;border-radius:12px;background:#ffb300;padding:12px 20px;font-weight:800;cursor:pointer}#touch{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}#touch button{pointer-events:auto;opacity:.82;margin:3px}#message{position:absolute;top:35%;width:100%;text-align:center;font-size:46px;font-weight:900;text-shadow:0 4px 8px black;pointer-events:none}small{opacity:.8}#touch{bottom:max(12px,env(safe-area-inset-bottom));align-items:flex-end;gap:10px;box-sizing:border-box;padding:0 12px;z-index:5}
#touch .steering,#touch .actions{display:flex;align-items:flex-end;gap:8px}
#touch .actions{display:grid;grid-template-columns:repeat(3,56px) 76px;grid-template-rows:repeat(2,58px);gap:7px}
#touch button{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none;min-width:58px;min-height:64px;margin:0;border:2px solid #ffffff77;border-radius:18px;color:#fff;background:#253951e8;font-size:15px;box-shadow:0 4px 0 #07131eaa;opacity:1;padding:6px;font-weight:900}
#touch button:active,#touch button.pressed{background:#ff9e20;transform:translateY(3px);box-shadow:0 1px 0 #07131e}
#touch .steering button{width:68px;height:82px;font-size:30px}
#touch .go{grid-column:4;grid-row:1/3;width:76px;height:123px;background:#14a85d;font-size:21px}
#touch .brake{grid-column:3;grid-row:2;background:#c63d4c}
#touch .nitro{grid-column:2;grid-row:2;background:#1677d5}
#touch .drift{grid-column:1;grid-row:2}
#touch .power{grid-column:2;grid-row:1}
#touch .actions .empty{grid-column:1;grid-row:1;pointer-events:none}
@media(max-width:650px){#touch{padding:0 7px;gap:5px}#touch .steering{gap:5px}#touch .steering button{width:53px;min-width:53px;height:72px}#touch .actions{grid-template-columns:repeat(3,43px) 65px;grid-template-rows:repeat(2,52px);gap:5px}#touch .actions button{min-width:43px;min-height:52px;font-size:11px;border-radius:13px}#touch .actions .go{width:65px;height:109px;font-size:19px}}
</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="message"></div><div id="touch"><div class="steering"><button type="button" data-key="a" aria-label="Steer left">◀</button><button type="button" data-key="d" aria-label="Steer right">▶</button></div><div class="actions"><span class="empty"></span><button type="button" class="power" data-key="e">POWER</button><button type="button" class="drift" data-key=" ">DRIFT</button><button type="button" class="nitro" data-key="Shift">NITRO</button><button type="button" class="brake" data-key="s">BRAKE</button><button type="button" class="go" data-key="w">GO</button></div></div><div id="menu"><h1>🏁 NITRO BEACH RACING</h1><p>Coastal Circuit · v0.4 Tropical Paradise</p><div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center"><button data-theme="day">☀️ DAY</button><button data-theme="sunset">🌅 SUNSET</button><button data-theme="neon">🌙 NEON NIGHT</button></div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center"><button data-difficulty="easy">EASY</button><button data-difficulty="normal">NORMAL</button><button data-difficulty="hard">HARD</button><button data-difficulty="expert">EXPERT</button></div><button id="start">QUICK RACE</button><button id="career">CAREER: ROOKIE RACE</button><small>W/↑ accelerate · S/↓ brake · A/D steer · Space drift · Shift nitro · E power-up</small><small id="progress"></small></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="main.js"></script></body></html>
