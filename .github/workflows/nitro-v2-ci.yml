name: Nitro Buggy 2 — Source checks and Android build
on:
  push:
    branches: [nitro-buggy-2-development-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript and UI references
        run: node tests/game-smoke.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          test -d "$ANDROID_HOME" || { echo 'ANDROID_HOME is unavailable'; exit 1; }
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        working-directory: android-studio
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Save APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: nitro-buggy-2-debug-apk
          path: android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK and capture Android startup logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-boot-timeout: 600
          script: |
            adb install -r android-studio/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.nitrobeach.racing/.MainActivity
            sleep 25
            adb logcat -d -v time > nitro-android-logcat.txt
            adb shell dumpsys activity activities > nitro-activity-state.txt
            adb shell screencap -p /sdcard/nitro-startup.png
            adb pull /sdcard/nitro-startup.png nitro-startup.png
            if grep -E 'FATAL EXCEPTION|Process: com.nitrobeach.racing|NitroWebView.*(Uncaught|SyntaxError|ReferenceError|TypeError|Script error|Failed to load resource)' nitro-android-logcat.txt; then
              echo 'Android fatal error or JavaScript exception detected'
              exit 1
            fi
            grep -q 'com.nitrobeach.racing' nitro-activity-state.txt || { echo 'Game activity not detected'; exit 1; }
            grep -q 'NITRO_GAME_INITIALIZED' nitro-android-logcat.txt || { echo 'Game initialization marker not observed: check WebView logcat and screenshot'; exit 1; }
            echo 'Game initialization marker observed; rendering and gameplay still require visual testing.'
      - name: Upload Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitro-android-startup-diagnostics
          path: |
            nitro-android-logcat.txt
            nitro-activity-state.txt
            nitro-startup.png
          if-no-files-found: ignore
