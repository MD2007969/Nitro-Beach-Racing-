name: Nitro Android diagnostics
on:
  push:
    paths:
      - 'android-studio/**'
      - 'tests/**'
      - '.github/workflows/nitro-diagnostics.yml'
  workflow_dispatch:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game script and HTML
        run: node tests/smoke.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Android debug APK
        working-directory: android-studio
        run: |
          gradle --version
          gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nitro-debug-apk
          path: android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install -r android-studio/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.nitrobeach.racing/.MainActivity
            sleep 20
            adb logcat -d -s NitroGame:D chromium:E AndroidRuntime:E > nitro-startup.log
            cat nitro-startup.log
            if grep -E 'FATAL EXCEPTION|Game startup problem|3D engine failed to load|3D engine could not be downloaded|JavaScript error:' nitro-startup.log; then exit 1; fi
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitro-startup-logs
          path: nitro-startup.log
          if-no-files-found: ignore
